<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1200" height="400" rx="16" fill="#1a1a19" stroke="#2c2c2a"/><text x="60" y="78" font-size="15" letter-spacing="2" fill="#898781">API ABIERTA · DATOS DE SEPA · GITHUB PAGES</text><text x="60" y="142" font-size="46" font-weight="700" fill="#f0efec">¿En qué súper está más barato?</text><rect x="60" y="214" width="40" height="4" rx="2" fill="#3987e5"/><text x="60" y="282" font-size="56" font-weight="700" fill="#f0efec">57 mil</text><text x="60" y="318" font-size="17" fill="#c3c2b7"><tspan x="60" dy="0">productos con precio</tspan><tspan x="60" dy="22">en un día</tspan></text><rect x="330" y="214" width="40" height="4" rx="2" fill="#3987e5"/><text x="330" y="282" font-size="56" font-weight="700" fill="#f0efec">12</text><text x="330" y="318" font-size="17" fill="#c3c2b7"><tspan x="330" dy="0">cadenas con datos</tspan><tspan x="330" dy="22">en todo el país</tspan></text><rect x="600" y="214" width="40" height="4" rx="2" fill="#3987e5"/><text x="600" y="282" font-size="56" font-weight="700" fill="#f0efec">14,3 M</text><text x="600" y="318" font-size="17" fill="#c3c2b7"><tspan x="600" dy="0">precios de sucursales</tspan><tspan x="600" dy="22">procesados por día</tspan></text><rect x="870" y="214" width="40" height="4" rx="2" fill="#3987e5"/><text x="870" y="282" font-size="56" font-weight="700" fill="#f0efec">$0</text><text x="870" y="318" font-size="17" fill="#c3c2b7"><tspan x="870" dy="0">de costo por mes:</tspan><tspan x="870" dy="22">sin servidor ni base</tspan></text></svg>